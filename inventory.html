<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Inventory · Mini-mart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>
  * {
    box-sizing: border-box;
  }

  .body {
    margin: 0;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
    color: black;
  }

  .brand {
    font-size: 16px;
    font-weight: bold;
  }

  .roleDisplay {
    font-size: 12px;
  }

  .inventoryPage {
    padding: 20px 3%;
  }

.inventoryHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
  }

.inventory {
    margin: 0;
    font-size: 25px;
    font-weight: bold;
  }

  .addITEM {
    width: 110px;
    height: 40px;
    background: black;
    color: white;
    border: none;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }

  .invensearch-row {
    display: grid;
    grid-template-columns: 3.3fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  .filterGroup {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .filterGroup label {
    color: grey;
    font-size: 11px;
  }

  .itemsearch {
    width: 100%;
    height: 39px;
    padding: 8px;
    border: 2px solid #555;
    border-radius: 0;
    background: white;
    font-size: 14px;
  }

  .tableContainer {
    width: 100%;
    overflow-x: auto;
  }

  .itemlist {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  .itemlist td {
    padding: 10px 5px;
    border-bottom: 1px solid #ddd;
    text-align: left;
    font-size: 13px;
  }

  .itemlist thead td {
    border-bottom: 2px solid #555;
    font-size: 11px;
    font-weight: bold;
  }

  .item {
    width: 30%;
  }

  .category {
    width: 13%;
  }

  .unit {
    width: 10%;
  }

  .price {
    width: 8%;
  }

  .stock {
    width: 8%;
  }

  .status {
    width: 12%;
  }

  .edit {
    width: 10%;
  }

  .addItemOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1000;
    overflow-y: auto;
    background: white;
  }

  .addItemForm {
    padding: 20px 3%;
    font-family: Arial, Helvetica, sans-serif;
  }

  .addItemForm h1 {
    margin: 0 0 16px;
    font-size: 25px;
  }

  .formGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 15px;
  }

  .formGroup {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .formGroup label {
    color: grey;
    font-size: 11px;
  }

  .formGroup input,
  .formGroup select {
    width: 100%;
    height: 39px;
    padding: 5px 10px;
    border: 2px solid #555;
    border-radius: 0;
    background: white;
    font-size: 14px;
  }

  .formButtons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .saveItem,
  .cancelItem {
    height: 40px;
    padding: 0 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }

  .saveItem {
    background: black;
    color: white;
    border: 2px solid black;
  }

  .cancelItem {
    background: white;
    color: black;
    border: 2px solid black;
  }

  @media (max-width: 700px) {

    .navbar {
      height: auto;
      min-height: 44px;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
    }

    .nav-left {
      flex-wrap: wrap;
      gap: 12px;
    }

    .nav-links {
      flex-wrap: wrap;
      gap: 12px;
    }

    .invensearch-row {
      grid-template-columns: 1fr;
    }

    .formGrid {
      grid-template-columns: 1fr;
    }

    .inventory {
      font-size: 22px;
    }

    .itemlist {
      min-width: 650px;
    }
  }
</style>
</head>

<body>
  <!-- Menu (filled in by app.js) -->
  <nav class="nav" id="nav"></nav>
  <main class="inventoryPage">
    <div class="inventoryHeader">
      <h1 class="inventory">Inventory</h1>
      <button class="addITEM" id="openAddItem">+ Add item</button>
    </div>
    <div class="invensearch-row">
      <div class="filterGroup">
        <label class="invensearch">SEARCH ITEM</label>
        <input type="text" class="itemsearch i" placeholder="">
      </div>
      <div class="filterGroup">
        <label class="invencategory">CATEGORY</label>
        <select class="itemsearch c" id="categoryFilter">
          <option value=""> </option>
          <option value="Drinks">Drinks</option>
          <option value="Canned Goods">Canned Goods</option>
          <option value="Fragile/Perishable">Fragile/Perishable</option>
          <option value="Utilities">Utilities</option>
          <option value="Cosmetics">Cosmetics</option>
          <option value="Processed Foods">Processed Foods</option>
          <option value="Frozen Goods">Frozen Goods</option>
        </select>
      </div>
      <div class="filterGroup">
        <label class="invenstatus">STATUS</label>
        <select class="itemsearch s" id="statusFilter">
          <option value=""> </option>
          <option value="Available">Available</option>
          <option value="Low Stock">Low Stock</option>
          <option value="Out of Stock">Out of Stock</option>
        </select>
      </div>
    </div>
    <div class="tableContainer">
      <table class="itemlist" id="inventoryTable">
        <thead>
          <tr>
            <td class="item">ITEM</td>
            <td class="category">CATEGORY</td>
            <td class="unit">UNIT</td>
            <td class="price">PRICE</td>
            <td class="stock">STOCK</td>
            <td class="status">STATUS</td>
            <td class="edit"></td>
          </tr>
        </thead>
        <tbody id="inventoryBody">
        </tbody>
      </table>
    </div>
  </main>
  <div class="addItemOverlay" id="addItemOverlay">
    <div class="addItemForm">
      <h1>Add item</h1>
      <form id="addItemForm">
        <div class="formGrid">
          <div class="formGroup">
            <label>ITEM NAME</label>
            <input type="text" id="itemName" required>
          </div>
          <div class="formGroup">
            <label>CATEGORY</label>
            <select id="itemCategory" required>
              <option value="">Select Category</option>
              <option>Drinks</option>
              <option>Canned Goods</option>
              <option>Fragile/Perishable</option>
              <option>Utilities</option>
              <option>Cosmetics</option>
              <option>Processed Foods</option>
              <option>Frozen Goods</option>
            </select>
          </div>
          <div class="formGroup">
            <label>UNIT (PIECE / PACK / BOX)</label>
            <input type="text" id="itemUnit" required>
          </div>
          <div class="formGroup">
            <label>COST PRICE</label>
            <input type="number" id="costPrice" min="0" step="0.01" required>
          </div>
          <div class="formGroup">
            <label>SELLING PRICE</label>
            <input type="number" id="sellingPrice" min="0" step="0.01" required>
          </div>
          <div class="formGroup">
            <label>CURRENT STOCK</label>
            <input type="number" id="currentStock" min="0" step="1" required>
          </div>
          <div class="formGroup">
            <label>REORDER LEVEL</label>
            <input type="number" id="reorderLevel" min="0" step="1" required>
          </div>
          <div class="formGroup">
            <label>EXPIRY DATE</label>
            <input type="date" id="expiryDate">
          </div>
          <div class="formGroup">
            <label>SUPPLIER</label>
            <input type="text" id="itemSupplier">
          </div>
        </div>
        <div class="formButtons">
          <button type="submit" class="saveItem">Save item</button>
          <button type="button" class="cancelItem" id="cancelAddItem">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/inventory.js"></script>
</body>

</html>
