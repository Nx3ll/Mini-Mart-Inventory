<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Reports · Mini-mart</title>
  </head>
  <body>
    <!-- Menu (filled in by app.js) -->
    <nav class="nav" id="nav"></nav>
    <main class="page">
      <h1>Reports</h1>
      <!-- Time range buttons -->
      <div class="tabs">
        <button type="button" class="btn filter-btn" data-period="today">Today</button>
        <button type="button" class="btn2 filter-btn" data-period="week">This week</button>
        <button type="button" class="btn2 filter-btn" data-period="month">This month</button>
      </div>
      <!-- Best sellers and slow movers -->
      <div class="cols">
        <section>
          <h2>Best sellers</h2>
          <div class="wrap">
            <table class="t">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Sold</th>
                </tr>
              </thead>
              <tbody id="bestSellersBody"></tbody>
            </table>
          </div>
        </section>
        <section>
          <h2>Slow movers</h2>
          <div class="wrap">
            <table class="t">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Sold</th>
                </tr>
              </thead>
              <tbody id="slowMoversBody"></tbody>
            </table>
          </div>
        </section>
      </div>
      <div class="card">
        <div class="lbl">Total sales</div>
        <div class="big" id="totalSalesAmount">₱0</div>
      </div>
    </main>
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
  </body>
</html>
