<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Activity log · Mini-mart</title>
  </head>
  <body>
    <!-- Menu (filled in by app.js) -->
    <nav class="nav" id="nav"></nav>
    <main class="page">
      <div class="hdr">
        <h1>Activity log</h1>
      </div>
      <!-- Log rows -->
      <div class="wrap">
        <table class="t">
          <thead>
            <tr>
              <th>When</th>
              <th>Who</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="log-rows"></tbody>
        </table>
      </div>
    </main>
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/activity-log.js"></script>
  </body>
</html>
