<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini-mart — Sales</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-left">
      <span class="brand">Mini-mart</span>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="inventory.html">Inventory</a>
        <a href="sales.html" class="active">Sales</a>
        <a href="stock-in.html">Stock In</a>
        <a href="reorder.html">Reorder</a>
        <a href="reports.html">Reports</a>
        <a href="activity-log.html">Activity Log</a>
        <a href="eload.html">E-load / GCash</a>
      </nav>
    </div>
    <div class="nav-right" id="userDisplay">Ana · Cashier</div>
  </header>

  <main class="container">
    <h1>Sales</h1>

    <div class="sales-layout">
      <!-- Left: Search & Product Table -->
      <div>
        <label class="field-label" for="searchInput">SEARCH ITEM</label>
        <input type="text" id="searchInput" style="margin-bottom: 18px;">

        <table>
          <thead>
            <tr>
              <th>ITEM</th>
              <th>PRICE</th>
              <th>STOCK</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
      </div>

      <!-- Right: Current Sale Card -->
      <div class="cart-box">
        <h2>Current sale</h2>
        <div id="cartList"></div>

        <div class="cart-total-row">
          <span>Total</span>
          <span id="cartTotal">₱0</span>
        </div>

        <div class="cart-actions">
          <button type="button" class="btn btn-primary btn-block" id="completeSaleBtn">Complete sale</button>
          <button type="button" class="btn btn-block" id="clearCartBtn">Clear</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
      </div>
    </div>
  </main>

  <script src="sales.js"></script>
</body>
</html>
