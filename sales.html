<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Sales · Mini-mart</title>
  </head>
  <body>
    <!-- Menu (filled in by app.js) -->
    <nav class="nav" id="nav"></nav>
    <main class="page">
      <h1>Sales</h1>
      <!-- Product list (left) and cart (right) -->
      <div class="sales-layout">
        <div>
          <label class="lbl" for="searchInput">Search item</label>
          <input class="in mb" type="text" id="searchInput">
          <div class="wrap">
            <table class="t">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="productTableBody"></tbody>
            </table>
          </div>
        </div>
        <section class="card">
          <h2>Current sale</h2>
          <div id="cartList"></div>
          <div class="cart-total-row"><span>Total</span><span id="cartTotal">₱0</span></div>
          <div class="cart-actions">
            <button type="button" class="btn btn-block" id="completeSaleBtn">Complete sale</button>
            <button type="button" class="btn2 btn-block" id="clearCartBtn">Clear</button>
          </div>
          <div id="statusMsg" class="status-msg" role="status"></div>
        </section>
      </div>
    </main>
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sales.js"></script>
  </body>
</html>
