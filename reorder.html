<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Reorder · Mini-mart</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background: white;
color: black;
font-family: Arial, Helvetica, sans-serif;
}

.roleDisplay {
font-size: 12px;
}

.reorderPage {
padding: 20px 3%;
}

.reorderHeader {
display: flex;
align-items: center;
justify-content: space-between;
}

.reorderHeader h1 {
margin: 10px 0 20px;
font-size: 25px;
}

#printList {
width: 100px;
height: 40px;
background: black;
color: white;
border: none;
font-size: 14px;
font-weight: bold;
cursor: pointer;
}

#printList:hover {
background: #333;
}

.description {
margin: 0 0 20px;
color: grey;
font-size: 11px;
}

.reorderTable {
width: 100%;
border-collapse: collapse;
table-layout: fixed;
}

.reorderTable th,
.reorderTable td {
padding: 10px 5px;
text-align: left;
border-bottom: 1px solid #ddd;
font-size: 13px;
}

.reorderTable th {
border-bottom: 2px solid #555;
font-size: 11px;
}

.reorderTable th:nth-child(1) { width: 30%; }
.reorderTable th:nth-child(2) { width: 10%; }
.reorderTable th:nth-child(3) { width: 13%; }
.reorderTable th:nth-child(4) { width: 29%; }
.reorderTable th:nth-child(5) { width: 18%; }

.statusBadge {
display: inline-block;
padding: 3px 7px;
font-size: 11px;
font-weight: bold;
}

.statusBadge.low {
border: 1px dashed black;
}

.statusBadge.out {
background: black;
color: white;
}

.emptyMessage {
padding: 20px 5px;
color: grey;
text-align: center;
}

.reorderActions {
display: flex;
align-items: center;
gap: 10px;
}

@media (max-width: 800px) {
.reorderHeader {
flex-wrap: wrap;
gap: 10px;
}
}

@media print {
.reorderActions {
display: none;
}
}
</style>
</head>
<body>
 <!-- Menu (filled in by app.js) -->
  <nav class="nav" id="nav"></nav>

<main class="reorderPage">
<div class="reorderHeader">
<h1>Reorder list</h1>
<div class="reorderActions">
<select id="branchSelect" class="nav-branch-select" title="Active Store Branch">
<option value="Main Branch">Main Branch</option>
<option value="Branch 2 - North">Branch 2 - North</option>
</select>
<button id="printList">Print list</button>
</div>
</div>
<p class="description">ITEMS AT OR BELOW THEIR REORDER LEVEL</p>

<div class="wrap">
<table class="reorderTable wide">
<thead>
<tr>
 <th>ITEM</th>
 <th>LEFT</th>
 <th>REORDER AT</th>
 <th>SUPPLIER</th>
 <th>STATUS</th>
</tr>
</thead>
<tbody id="reorderBody"></tbody>
</table>
</div>
</main>
<!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reorder.js"></script>
</body>
</html>
