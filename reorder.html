<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Mini-mart - Reorder</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
 <header class="navbar">
  <div class="nav-left">
   <span class="brand">Mini-mart</span>
   <nav class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="inventory.html">Inventory</a>
    <a href="sales.html">Sales</a>
    <a href="stock-in.html">Stock in</a>
    <a href="reorder.html" class="active">Reorder</a>
    <a href="suppliers.html">Suppliers</a>
    <a href="reports.html">Reports</a>
    <a href="eload.html">E-load / GCash</a>
    <a href="activity-log.html">Activity log</a>
   </nav>
  </div>
  <div class="nav-right">
   <select id="branchSelect" class="nav-branch-select" title="Active Store Branch">
    <option value="Main Branch">Main Branch</option>
    <option value="Branch 2 - North">Branch 2 - North</option>
   </select>
   <span id="roleDisplay">Role: Owner / Manager</span>
  </div>
 </header>

<main class="reorderPage">
<div class="reorderHeader">
<h1>Reorder list</h1>
<button id="printList">Print list</button>
</div>
<p class="description">ITEMS AT OR BELOW THEIR REORDER LEVEL</p>

<table class="reorderTable">
<thead>
<tr>
 <th>ITEM</th>
 <th>LEFT</th>
 <th>REORDER AT</th>
 <th>SUPPLIER</th>
 <th>STATUS</th>
</tr>
</thead>
<tbody id="reorderBody"></tbody>
</table>
</main>
<script src="reorder.js"></script>
</body>
</html>
<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
background: white;
color: black;
font-family: Arial, Helvetica, sans-serif;
}

.roleDisplay {
font-size: 12px;
}

.reorderPage {
padding: 20px 3%;
}

.reorderHeader {
display: flex;
align-items: center;
justify-content: space-between;
}

.reorderHeader h1 {
margin: 10px 0 20px;
font-size: 25px;
}

#printList {
width: 100px;
height: 40px;
background: black;
color: white;
border: none;
font-size: 14px;
font-weight: bold;
cursor: pointer;
}

#printList:hover {
background: #333;
}

.description {
margin: 0 0 20px;
color: grey;
font-size: 11px;
}

.reorderTable {
width: 100%;
border-collapse: collapse;
table-layout: fixed;
}

.reorderTable th,
.reorderTable td {
padding: 10px 5px;
text-align: left;
border-bottom: 1px solid #ddd;
font-size: 13px;
}

.reorderTable th {
border-bottom: 2px solid #555;
font-size: 11px;
}

.reorderTable th:nth-child(1) { width: 30%; }
.reorderTable th:nth-child(2) { width: 10%; }
.reorderTable th:nth-child(3) { width: 13%; }
.reorderTable th:nth-child(4) { width: 29%; }
.reorderTable th:nth-child(5) { width: 18%; }

.statusBadge {
display: inline-block;
padding: 3px 7px;
font-size: 11px;
font-weight: bold;
}

.statusBadge.low {
border: 1px dashed black;
}

.statusBadge.out {
background: black;
color: white;
}

.emptyMessage {
padding: 20px 5px;
color: grey;
text-align: center;
}

</style>
