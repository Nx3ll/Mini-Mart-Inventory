<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Stock in · Mini-mart</title>
  </head>
  <body>
    <!-- Menu (filled in by app.js) -->
    <nav class="nav" id="nav"></nav>
    <main class="page">
      <h1>Stock in</h1>
      <div>
        <!-- Pick item, quantity and supplier -->
        <div class="form-row">
          <div>
            <label class="lbl" for="itemSelect">Item</label>
            <select class="in" id="itemSelect"></select>
          </div>
          <div>
            <label class="lbl" for="qtyInput">Quantity received</label>
            <input class="in" type="number" id="qtyInput" min="1" value="1">
          </div>
          <div>
            <label class="lbl" for="supplierSelect">Supplier</label>
            <select class="in" id="supplierSelect"></select>
          </div>
        </div>
        <button type="button" class="btn" id="addDeliveryBtn">+ Add to delivery</button>
      </div>
      <!-- Items in this delivery -->
      <section>
        <h2>This delivery</h2>
        <div class="wrap">
          <table class="t">
            <thead>
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Unit</th>
                <th>Supplier</th>
                <th>Expiry</th>
              </tr>
            </thead>
            <tbody id="deliveryTableBody"></tbody>
          </table>
        </div>
      </section>
      <div>
        <button type="button" class="btn" id="confirmDeliveryBtn">Confirm delivery</button>
        <div id="statusMsg" class="status-msg" role="status"></div>
      </div>
    </main>
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/stock-in.js"></script>
  </body>
</html>
