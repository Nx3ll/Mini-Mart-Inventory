<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>Stock in · Mini-mart</title>
  </head>
  <body>
    <!-- Menu (filled in by app.js) -->
    <nav class="nav" id="nav"></nav>
    <main class="page">
      <div class="hdr">
        <h1>Stock in</h1>
      </div>

      <!-- Tabs for Place Order, Waiting / In Transport, and Confirm Delivery -->
      <div class="tabs" role="tablist">
        <button type="button" class="btn tab-btn" data-tab="order">Place order</button>
        <button type="button" class="btn2 tab-btn" data-tab="waiting">Waiting / In transport <span id="waitingCount"></span></button>
        <button type="button" class="btn2 tab-btn" data-tab="confirm">Confirm delivery <span id="confirmCount"></span></button>
      </div>

      <div id="statusMsg" class="status-msg" role="status"></div>

      <!-- Tab 1: Place order (draft persists across tab/page switches) -->
      <section id="tab-order" class="tab-panel">
        <div class="mb">
          <div class="form-row">
            <div>
              <label class="lbl" for="itemSelect">Item</label>
              <select class="in" id="itemSelect"></select>
            </div>
            <div>
              <label class="lbl" for="qtyInput">Quantity to order</label>
              <input class="in" type="number" id="qtyInput" min="1" value="1">
            </div>
            <div>
              <label class="lbl" for="supplierSelect">Supplier</label>
              <select class="in" id="supplierSelect"></select>
            </div>
          </div>
          <button type="button" class="btn" id="addDeliveryBtn">+ Add to order</button>
        </div>

        <h2>Order draft</h2>
        <div class="wrap mb">
          <table class="t">
            <thead>
              <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Unit</th>
                <th>Supplier</th>
                <th>Est. Expiry</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="deliveryTableBody"></tbody>
          </table>
        </div>

        <div class="hdr">
          <button type="button" class="btn" id="placeOrderBtn">Place order (Send to transport)</button>
          <button type="button" class="btn2 btn-sm" id="clearDraftBtn">Clear draft</button>
        </div>
      </section>

      <!-- Tab 2: Waiting / In transport -->
      <section id="tab-waiting" class="tab-panel" style="display: none;">
        <h2>Orders in transport</h2>
        <p class="note mb">Orders placed with suppliers and currently on the way.</p>
        <div class="wrap">
          <table class="t">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Placed</th>
                <th>Supplier</th>
                <th>Items</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="waitingTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Tab 3: Confirm delivery -->
      <section id="tab-confirm" class="tab-panel" style="display: none;">
        <h2>Confirm arrived deliveries</h2>
        <p class="note mb">Verify arrived orders and add items into store inventory.</p>
        <div class="wrap">
          <table class="t">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Placed</th>
                <th>Supplier</th>
                <th>Items</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="confirmTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/stock-in.js"></script>
  </body>
</html>
