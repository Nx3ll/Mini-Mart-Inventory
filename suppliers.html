<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mini-mart - Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <div class="nav-left">
      <span class="brand">Mini-mart</span>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="inventory.html">Inventory</a>
        <a href="sales.html">Sales</a>
        <a href="stock-in.html">Stock in</a>
        <a href="reorder.html">Reorder</a>
        <a href="suppliers.html" class="active">Suppliers</a>
        <a href="reports.html">Reports</a>
        <a href="eload.html">E-load / GCash</a>
        <a href="activity-log.html">Activity log</a>
      </nav>
    </div>
    <span id="roleDisplay">Role: Owner / Manager</span>
  </header>

 <main class="suppliersPage">
  <div class="suppliersHeader">
   <h1>Suppliers</h1>
   <button id="addSupplier">+ Add supplier</button>
  </div>

  <table class="suppliersTable">
   <thead>
    <tr>
     <th>SUPPLIER</th>
     <th>CONTACT</th>
     <th>SUPPLIES</th>
     <th>LAST DELIVERY</th>
     <th></th>
    </tr>
   </thead>
   <tbody id="supplierBody"></tbody>
  </table>
 </main>

 <script src="suppliers.js"></script>
</body>
</html>

<style>

* {
 box-sizing: border-box;
}

body {
 margin: 0;
 background: white;
 color: black;
 font-family: Arial, Helvetica, sans-serif;
}

.suppliersPage {
 padding: 31px 3%;
}

.suppliersHeader {
 display: flex;
 align-items: center;
 justify-content: space-between;
 margin-bottom: 29px;
}

.suppliersHeader h1 {
 margin: 8px 0;
 font-size: 32px;
}

#addSupplier {
 width: 181px;
 height: 54px;
 background: black;
 color: white;
 border: none;
 font-size: 16px;
 font-weight: bold;
 cursor: pointer;
}

#addSupplier:hover {
 background: #333;
}

.suppliersTable {
 width: 100%;
 border-collapse: collapse;
 table-layout: fixed;
}

.suppliersTable th,
.suppliersTable td {
 padding: 12px 8px;
 text-align: left;
 font-size: 16px;
}

.suppliersTable th {
 font-size: 13px;
 font-weight: bold;
 border-bottom: 2px solid black;
}

.suppliersTable td {
 border-bottom: 1px solid #bbb;
}

.suppliersTable th:nth-child(1) { width: 25%; }
.suppliersTable th:nth-child(2) { width: 22%; }
.suppliersTable th:nth-child(3) { width: 30%; }
.suppliersTable th:nth-child(4) { width: 13%; }
.suppliersTable th:nth-child(5) { width: 10%; }

.suppliersTable a {
 color: black;
 text-decoration: underline;
 cursor: pointer;
}

</style>
