<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Suppliers · Mini-mart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <style>

* {
 box-sizing: border-box;
}

body {
 margin: 0;
 background: white;
 color: black;
 font-family: Arial, Helvetica, sans-serif;
}

.suppliersPage {
 padding: 31px 3%;
}

.suppliersHeader {
 display: flex;
 align-items: center;
 justify-content: space-between;
 margin-bottom: 29px;
}

.suppliersHeader h1 {
 margin: 8px 0;
 font-size: 32px;
}

#addSupplier {
 width: 181px;
 height: 54px;
 background: black;
 color: white;
 border: none;
 font-size: 16px;
 font-weight: bold;
 cursor: pointer;
}

#addSupplier:hover {
 background: #333;
}

.suppliersTable {
 width: 100%;
 border-collapse: collapse;
 table-layout: fixed;
}

.suppliersTable th,
.suppliersTable td {
 padding: 12px 8px;
 text-align: left;
 font-size: 16px;
}

.suppliersTable th {
 font-size: 13px;
 font-weight: bold;
 border-bottom: 2px solid black;
}

.suppliersTable td {
 border-bottom: 1px solid #bbb;
}

.suppliersTable th:nth-child(1) { width: 25%; }
.suppliersTable th:nth-child(2) { width: 22%; }
.suppliersTable th:nth-child(3) { width: 30%; }
.suppliersTable th:nth-child(4) { width: 13%; }
.suppliersTable th:nth-child(5) { width: 10%; }

.suppliersTable a {
 color: black;
 text-decoration: underline;
 cursor: pointer;
}

@media (max-width: 800px) {
.suppliersHeader {
flex-wrap: wrap;
gap: 12px;
}

.suppliersHeader h1 {
font-size: 26px;
}

#addSupplier {
width: auto;
height: 48px;
padding: 0 20px;
}
}
</style>
</head>

<body>
  <!-- Menu (filled in by app.js) -->
  <nav class="nav" id="nav"></nav>

 <main class="suppliersPage">
  <div class="suppliersHeader">
   <h1>Suppliers</h1>
   <button id="addSupplier">+ Add supplier</button>
  </div>

  <div class="wrap">
  <table class="suppliersTable wide">
   <thead>
    <tr>
     <th>SUPPLIER</th>
     <th>CONTACT</th>
     <th>SUPPLIES</th>
     <th>LAST DELIVERY</th>
     <th></th>
    </tr>
   </thead>
   <tbody id="supplierBody"></tbody>
  </table>
  </div>
 </main>

 <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/suppliers.js"></script>
</body>
</html>
