<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <title>E-load / GCash · Mini-mart</title>
  </head>
  <body>
    <!-- Menu (filled in by app.js) -->
    <nav class="nav" id="nav"></nav>
    <main class="page">
      <h1>E-load / GCash</h1>
      <!-- Balances and fees -->
      <div class="grid3">
        <div class="card">
          <div class="lbl">GCash wallet balance</div>
          <div class="big" id="gcashBalance">₱0</div>
        </div>
        <div class="card">
          <div class="lbl">E-load retailer wallet</div>
          <div class="big" id="eloadBalance">₱0</div>
        </div>
        <div class="card">
          <div class="lbl">Service fees earned</div>
          <div class="big" id="feesEarned">₱0</div>
        </div>
      </div>
      <!-- Update a wallet by hand -->
      <section class="card">
        <h2>Manual wallet update</h2>
        <div class="form-row end">
          <div>
            <label class="lbl" for="walletSelect">Wallet</label>
            <select class="in" id="walletSelect">
              <option value="gcash">GCash Wallet</option>
              <option value="eload">E-load Retailer Wallet</option>
            </select>
          </div>
          <div>
            <label class="lbl" for="newWalletAmount">Current balance (₱)</label>
            <input class="in" type="number" id="newWalletAmount" placeholder="0" min="0">
          </div>
          <div>
            <button type="button" class="btn btn-block" id="updateWalletBtn">Update balance</button>
          </div>
        </div>
      </section>
      <!-- Transactions (left) and new transaction (right) -->
      <div class="sales-layout">
        <section>
          <h2>Recent transactions</h2>
          <div class="wrap">
            <table class="t">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Mobile no.</th>
                  <th>Amount</th>
                  <th>Fee</th>
                </tr>
              </thead>
              <tbody id="txTableBody"></tbody>
            </table>
          </div>
        </section>
        <section class="card">
          <h2>Record transaction</h2>
          <div class="field">
            <label class="lbl" for="txType">Service type</label>
            <select class="in" id="txType">
              <option value="GCash Cash-In">GCash Cash-In (deducts GCash)</option>
              <option value="GCash Cash-Out">GCash Cash-Out (adds to GCash)</option>
              <option value="E-load">E-load (deducts load wallet)</option>
            </select>
          </div>
          <div class="field">
            <label class="lbl" for="mobileInput">Customer mobile no. (<span id="digitCounter">0/11</span>)</label>
            <input class="in" type="text" id="mobileInput" placeholder="09XXXXXXXXX" maxlength="11" inputmode="numeric">
          </div>
          <div class="field">
            <label class="lbl" for="amountInput">Amount (₱)</label>
            <input class="in" type="number" id="amountInput" placeholder="100" min="1">
          </div>
          <div class="field">
            <label class="lbl" for="feeInput">Service fee (₱)</label>
            <input class="in" type="number" id="feeInput" value="10" min="0">
          </div>
          <button type="button" class="btn btn-block" id="recordTxBtn">Record transaction</button>
          <div id="statusMsg" class="status-msg" role="status"></div>
        </section>
      </div>
    </main>
    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/eload.js"></script>
  </body>
</html>
